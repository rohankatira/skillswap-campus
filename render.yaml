# render.yaml — Render Blueprint
# Defines both services so Render can set them up automatically.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ──────────────────────────────────────────────────────────
  # 1. Backend — Express / Node.js Web Service
  # ──────────────────────────────────────────────────────────
  - type: web
    name: skillswap-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start        # runs: node src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000               # Render always uses port 10000 internally
      - key: MONGODB_URI
        sync: false                # set manually in the Render dashboard
      - key: BETTER_AUTH_SECRET
        generateValue: true        # Render auto-generates a random value
      - key: BETTER_AUTH_URL
        # Replace with your actual server URL after first deploy
        value: https://skillswap-server.onrender.com
      - key: CLIENT_ORIGIN
        # Replace with your actual client URL after first deploy
        value: https://skillswap-client.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: SkillSwap Campus <skillswapcampus01@gmail.com>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false

  # ──────────────────────────────────────────────────────────
  # 2. Frontend — React / Vite Static Site
  # ──────────────────────────────────────────────────────────
  - type: web
    name: skillswap-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback — React Router handles routing
    envVars:
      - key: VITE_API_URL
        # Replace with your actual server URL after first deploy
        value: https://skillswap-server.onrender.com
